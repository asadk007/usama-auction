const CHECKS=[['engine','Engine / starting'],['gearbox','Gearbox / clutch'],['body','Body / paint / accident'],['suspension','Suspension / steering'],['brakes','Brakes'],['ac','AC / cooling'],['tyres','Tyres / wheels'],['interior','Interior / electronics'],['documents','Documents / chassis / engine number']];

function openDB(){return new Promise((resolve,reject)=>{let q=indexedDB.open('auction-inspections-v1',1);q.onupgradeneeded=()=>{let d=q.result;d.createObjectStore('inspections',{keyPath:'id'});d.createObjectStore('photos',{keyPath:'id'})};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function store(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}
function req(q){return new Promise((res,rej)=>{q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function all(name){return req(store(name).getAll())}async function get(name,id){return req(store(name).get(id))}async function put(name,val){return req(store(name,'readwrite').put(val))}async function del(name,id){return req(store(name,'readwrite').delete(id))}
function setTab(){['Cars','Review','Data'].forEach(t=>$('#tab'+t).className=(view===t.toLowerCase()?'':'secondary'))}
async function navigate(v){view=v;setTab();if(v==='cars')await carsView();if(v==='review')await reviewView();if(v==='data')await dataView()}
async function carsView(){let entries=await all('inspections');let byId=Object.fromEntries(entries.map(e=>[e.id,e]));let done=entries.filter(x=>x.finished).length;$('#content').innerHTML=`<div class="stats"><div class="card"><div class="num">77</div><span class="muted">Vehicles</span></div><div class="card"><div class="num">${done}</div><span class="muted">Inspected</span></div><div class="card"><div class="num">${entries.filter(x=>x.finished&&x.decision==='Buy').length}</div><span class="muted">Buy shortlist</span></div></div><div class="card"><label for="search">Find car by registration, make or model</label><input id="search" placeholder="e.g. LHC-8 or Corolla" oninput="filterCars()"><div style="margin-top:10px"><select id="statusFilter" onchange="filterCars()"><option value="all">All vehicles</option><option value="pending">Not inspected</option><option value="done">Inspected</option><option value="buy">Buy shortlist</option></select></div></div><div id="carList"></div>`;window.carCache=byId;filterCars()}
function filterCars(){let q=$('#search').value.toLowerCase(),f=$('#statusFilter').value;let cs=CARS.filter(c=>(c.reg+' '+c.name+' '+c.year).toLowerCase().includes(q)).filter(c=>{let r=carCache[c.id];return f==='all'||(f==='pending'&&!r?.finished)||(f==='done'&&r?.finished)||(f==='buy'&&r?.finished&&r.decision==='Buy')});$('#carList').innerHTML=cs.map(c=>{let r=carCache[c.id],status=r?.finished?(r.decision||'Inspected'):r?'In progress':'Not inspected';return `<div class="card"><div class="row"><div><div class="carname">${esc(c.reg)} · ${esc(c.name)}</div><div class="muted">${esc(c.year)} · Reserve ${money(c.reserve)}</div><span class="pill">${esc(status)}</span></div><button onclick="startCar(${c.id})">${r?.finished?'Edit':'Inspect'}</button></div></div>`}).join('')||'<div class="card">No matching cars.</div>'}
async function startCar(id){activeId=id;step=0;let saved=await get('inspections',id);draft=saved?structuredClone(saved):{id,checks:{},decision:'Maybe',notes:'',repair:0,maxBid:'',offer:'',odometer:'',grade:'',finished:false,updated:''};view='inspect';setTab();renderStep()}
function currentCar(){return CARS.find(c=>c.id===activeId)}
function collectStep(){if(step<CHECKS.length){let k=CHECKS[step][0],c=draft.checks[k]||{};let el=$('input[name="condition"]:checked');if(!el)return false;c.condition=el.value;let note=$('#issueNote');let cost=$('#issueCost');if(c.condition==='Minor Issue'||c.condition==='Major Issue'){if(!note?.value.trim()){alert('Please describe the issue before continuing.');return false}c.comment=note.value.trim();c.cost=Number(cost?.value||0)}else{c.comment='';c.cost=0}draft.checks[k]=c}else{for(let id of ['odometer','grade','repair','maxBid','offer','decision','notes']){let e=$('#'+id);if(e)draft[id]=e.value} }return true}
async function persist(finished=false){draft.updated=new Date().toISOString();draft.finished=finished||draft.finished;await put('inspections',draft)}
async function nextStep(){if(!collectStep())return;await persist(false);if(step<CHECKS.length){step++;renderStep()}else{draft.finished=true;await persist(true);alert('Inspection saved on this phone.');navigate('cars')}}
async function prevStep(){if(!collectStep())return;await persist(false);step=Math.max(0,step-1);renderStep()}
async function saveExit(){if(!collectStep())return;await persist(false);navigate('cars')}
function issueToggle(){let v=$('input[name="condition"]:checked')?.value;$('#issueBox').classList.toggle('hidden',v!=='Minor Issue'&&v!=='Major Issue')}
async function renderStep(){let c=currentCar();let heading=`<div class="card"><div class="row"><div><strong>${esc(c.reg)} · ${esc(c.name)}</strong><div class="muted">${esc(c.year)} · Reserve ${money(c.reserve)}</div></div><button class="secondary" onclick="saveExit()">Save & exit</button></div><div class="progress"><div style="width:${(step+1)/(CHECKS.length+1)*100}%"></div></div><span class="muted">Step ${step+1} of ${CHECKS.length+1}</span></div>`;
let body='';if(step<CHECKS.length){let [k,title]=CHECKS[step],a=draft.checks[k]||{};body=`<div class="card"><div class="section">${esc(title)}</div><p class="muted">Select the condition. For any issue, a comment is required.</p>${CONDITIONS.map(o=>`<label class="option ${a.condition===o?'active':''}"><input style="width:auto;margin-right:10px" type="radio" name="condition" value="${o}" ${a.condition===o?'checked':''} onchange="issueToggle();document.querySelectorAll('.option').forEach(x=>x.classList.toggle('active',x.querySelector('input').checked))">${o}</label>`).join('')}<div id="issueBox" class="${a.condition==='Minor Issue'||a.condition==='Major Issue'?'':'hidden'}"><label>What exactly is wrong? (required)</label><textarea id="issueNote" rows="3" placeholder="Describe noise, damage, fault, missing documents...">${esc(a.comment||'')}</textarea><label>Estimated repair cost (PKR)</label><input type="number" id="issueCost" min="0" value="${Number(a.cost||0)}"></div></div>`}else{body=`<div class="card"><div class="section">Final inspection & buying decision</div><label>Odometer reading (km)</label><input id="odometer" type="number" min="0" value="${esc(draft.odometer)}"><label>Overall grade (your assessment)</label><select id="grade">${['','A','B','C','D','Reject'].map(x=>`<option ${draft.grade===x?'selected':''}>${x}</option>`).join('')}</select><label>Other estimated repairs (PKR)</label><input id="repair" type="number" min="0" value="${esc(draft.repair)}"><label>Maximum bid (PKR)</label><input id="maxBid" type="number" min="0" value="${esc(draft.maxBid)}"><label>Actual bid / purchase price (PKR)</label><input id="offer" type="number" min="0" value="${esc(draft.offer)}"><label>Buying decision</label><select id="decision">${['Buy','Maybe','Reject'].map(x=>`<option ${draft.decision===x?'selected':''}>${x}</option>`).join('')}</select><label>General notes</label><textarea id="notes" rows="3">${esc(draft.notes)}</textarea></div><div class="card"><strong>Vehicle photos $('#content').innerHTML=heading+body+`<div class="actions"><button class="secondary" ${step===0?'disabled':''} onclick="prevStep()">Back</button><button onclick="nextStep()">${step===CHECKS.length?'Finish & save':'Next'}</button></div>`;if(step===CHECKS.length)renderPhotos()}
async function addPhotos(files){for(let file of files){if(!file.type.startsWith('image/'))continue;let compressed=await shrink(file);await put('photos',{id:crypto.randomUUID(),carId:activeId,name:file.name,blob:compressed,created:new Date().toISOString()})}renderPhotos()}
async function shrink(file){try{let bmp=await createImageBitmap(file),scale=Math.min(1,1600/Math.max(bmp.width,bmp.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bmp.width*scale);canvas.height=Math.round(bmp.height*scale);canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);bmp.close();return await new Promise(r=>canvas.toBlob(b=>r(b||file),'image/jpeg',.75))}catch{return file}}
async function renderPhotos(){photoUrls.forEach(URL.revokeObjectURL);photoUrls=[];let a=(await all('photos')).filter(x=>x.carId===activeId);$('#photos').innerHTML=a.map(x=>{let url=URL.createObjectURL(x.blob);photoUrls.push(url);return `<div class="thumb"><img src="${url}" alt="Vehicle photo"><button onclick="removePhoto('${x.id}')" aria-label="Remove photo">×</button></div>`}).join('')}
async function removePhoto(id){if(!confirm('Remove this photo?'))return;await del('photos',id);renderPhotos()}
async function reviewView(){let a=(await all('inspections')).filter(x=>x.finished),rows=a.map(x=>{let c=CARS.find(c=>c.id===x.id);let repair=Number(x.repair||0)+Object.values(x.checks||{}).reduce((s,v)=>s+Number(v.cost||0),0);return {...x,car:c,totalRepair:repair}});rows.sort((a,b)=>({Buy:0,Maybe:1,Reject:2}[a.decision]??3)-({Buy:0,Maybe:1,Reject:2}[b.decision]??3));$('#content').innerHTML=`<div class="card"><div class="section">Buying comparison</div><div class="muted">${rows.length} completed inspections · ${rows.filter(x=>x.decision==='Buy').length} Buy · ${rows.filter(x=>x.decision==='Maybe').length} Maybe · ${rows.filter(x=>x.decision==='Reject').length} Reject</div></div>${rows.map(x=>`<div class="card"><div class="row"><div><strong>${esc(x.car.reg)} · ${esc(x.car.name)}</strong><div class="muted">${esc(x.car.year)} · Grade ${esc(x.grade||'Not graded')}</div></div><span class="pill">${esc(x.decision)}</span></div><p>Reserve: <b>${money(x.car.reserve)}</b><br>Estimated repairs: <b>${money(x.totalRepair)}</b><br>Reserve + repairs: <b>${money(x.car.reserve+x.totalRepair)}</b><br>Maximum bid: <b>${x.maxBid?money(x.maxBid):'Not set'}</b></p><button class="secondary" onclick="startCar(${x.id})">Review / edit</button></div>`).join('')||'<div class="card">No completed inspections yet.</div>'}`}
async function dataView(){$('#content').innerHTML=`<div class="card"><div class="section">Export and backup</div><p>Export a real Excel .xlsx workbook containing all 77 vehicles, their inspection answers, issue comments, repair costs and decisions.</p><div class="toolbar"><button onclick="exportExcel()">Export Excel (.xlsx)</button><button class="secondary" onclick="exportBackup()">Backup with photos (.json)</button></div></div><div class="card"><strong>Restore a backup</strong><p class="muted">Select a backup JSON from this app. Matching inspections and photos are replaced by the backup data.</p><input type="file" accept="application/json,.json" onchange="importBackup(this.files[0])"></div><div class="warning"><strong>Important:</strong> Keep backup copies outside the phone. Offline storage is specific to this browser and site address. The Excel file does not embed photos; the JSON backup contains the photo data. Avoid private/incognito mode. Test offline access before the auction.</div>`}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),15000)}
async function blobToData(b){return new Promise((resolve,reject)=>{let r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(b)})}
async function exportBackup(){let inspections=await all('inspections'),photos=await all('photos');let data={version:1,exported:new Date().toISOString(),inspections,photos:await Promise.all(photos.map(async x=>({...x,blob:await blobToData(x.blob)})))};download(new Blob([JSON.stringify(data)],{type:'application/json'}),'auction-inspection-backup-'+new Date().toISOString().slice(0,10)+'.json')}
async function importBackup(file){if(!file)return;try{let data=JSON.parse(await file.text());if(data.version!==1||!Array.isArray(data.inspections)||!Array.isArray(data.photos))throw Error('Invalid backup format');if(!confirm(`Restore ${data.inspections.length} inspections and ${data.photos.length} photos? Existing matching records will be overwritten.`))return;for(let x of data.inspections)if(CARS.some(c=>c.id===x.id))await put('inspections',x);for(let x of data.photos){if(!CARS.some(c=>c.id===x.carId)||typeof x.blob!=='string'||!x.blob.startsWith('data:image/'))continue;let b=await(await fetch(x.blob)).blob();await put('photos',{...x,blob:b})}alert('Backup restored.');navigate('cars')}catch(e){alert('Could not restore backup: '+e.message)}}
// Small self-contained ZIP (stored entries) to create a genuine XLSX entirely offline.
const te=new TextEncoder();function crc32(b){let c=~0;for(let x of b){c^=x;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(~c)>>>0}
function zip(files){let chunks=[],central=[],offset=0;for(let [name,content] of Object.entries(files)){let n=te.encode(name),d=te.encode(content),crc=crc32(d),h=new Uint8Array(30+n.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint32(14,crc,true);v.setUint32(18,d.length,true);v.setUint32(22,d.length,true);v.setUint16(26,n.length,true);h.set(n,30);chunks.push(h,d);let c=new Uint8Array(46+n.length),w=new DataView(c.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,0x0800,true);w.setUint32(16,crc,true);w.setUint32(20,d.length,true);w.setUint32(24,d.length,true);w.setUint16(28,n.length,true);w.setUint32(42,offset,true);c.set(n,46);central.push(c);offset+=h.length+d.length}let centralSize=central.reduce((s,x)=>s+x.length,0),end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,central.length,true);e.setUint16(10,central.length,true);e.setUint32(12,centralSize,true);e.setUint32(16,offset,true);return new Blob([...chunks,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function xml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function colName(i){let s='';for(i++;i;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s}
function worksheet(rows){let body=rows.map((row,r)=>`<row r="${r+1}">${row.map((v,i)=>{let ref=colName(i)+(r+1);return typeof v==='number'&&Number.isFinite(v)?`<c r="${ref}"><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"><is><t>${xml(v)}</t></is></c>`}).join('')}</row>`).join('');return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetData>${body}</sheetData><autoFilter ref="A1:${colName(rows[0].length-1)}${rows.length}"/></worksheet>`}
async function exportExcel(){let inspections=await all('inspections'),byId=Object.fromEntries(inspections.map(x=>[x.id,x]));let headings=['ID','Registration','Car name / variant','Model year','Reserve price PKR','Inspection status','Overall grade','Buying decision','Odometer KM','Additional repair PKR','Issue repair PKR','Total estimated repair PKR','Reserve + repairs PKR','Maximum bid PKR','Actual bid PKR','General notes','Updated'];for(let [k,t] of CHECKS)headings.push(t+' condition',t+' comment',t+' repair PKR');let rows=[headings,...CARS.map(c=>{let x=byId[c.id]||{},issue=Object.values(x.checks||{}).reduce((s,a)=>s+Number(a.cost||0),0),repair=Number(x.repair||0);return [c.id,c.reg,c.name,c.year,c.reserve,x.finished?'Inspected':x.updated?'In progress':'Not inspected',x.grade||'',x.decision||'',x.odometer||'',repair,issue,repair+issue,c.reserve+repair+issue,x.maxBid?Number(x.maxBid):'',x.offer?Number(x.offer):'',x.notes||'',x.updated||'',...CHECKS.flatMap(([k])=>{let a=x.checks?.[k]||{};return [a.condition||'',a.comment||'',Number(a.cost||0)]})]})];let files={'[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>','_rels/.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>','xl/workbook.xml':'<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Auction Inspections" sheetId="1" r:id="rId1"/></sheets></workbook>','xl/_rels/workbook.xml.rels':'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>','xl/worksheets/sheet1.xml':worksheet(rows)};download(zip(files),'auction-inspections-'+new Date().toISOString().slice(0,10)+'.xlsx')}
